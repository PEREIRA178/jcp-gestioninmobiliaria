<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ajustes — JCP Admin</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet"/>
<link rel="stylesheet" href="/static/css/admin.css"/>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<style>
:root{
  --r-xs:4px;--r-sm:12px;--r-md:16px;--r-lg:24px;--r-xl:32px;--r-full:9999px;
  --ease-express:cubic-bezier(0.05,0.7,0.1,1.0);
  --ease-standard:cubic-bezier(0.2,0.0,0.0,1.0);
  --font-display:'DM Serif Display',Georgia,serif;
  --font-body:'DM Sans',system-ui,sans-serif;
  --sidebar-w:260px;--topbar-h:64px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);background:var(--md-surface-dim);color:var(--md-on-surface);line-height:1.6;display:flex;min-height:100vh}

/* ── SIDEBAR ── */
.sidebar{
  width:var(--sidebar-w);min-height:100vh;position:fixed;left:0;top:0;z-index:100;
  background:var(--md-surface-bright);border-right:1px solid var(--md-outline-variant);
  display:flex;flex-direction:column;padding:20px 12px;
  transition:transform 300ms var(--ease-express);
}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px;border-bottom:1px solid var(--md-outline-variant);margin-bottom:12px}
.sidebar-brand-icon{width:40px;height:40px;border-radius:10px;background:var(--md-primary);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-size:18px;box-shadow:0 2px 6px rgba(61,61,239,0.25)}
.sidebar-brand-text{display:flex;flex-direction:column}
.sidebar-brand-name{font-family:var(--font-display);font-size:15px;color:var(--md-on-surface);line-height:1.1}
.sidebar-brand-sub{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--md-outline);font-weight:500}

.sidebar-section{margin-bottom:8px}
.sidebar-section-title{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--md-outline);padding:12px 12px 6px}
.sidebar-link{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);
  font-size:13.5px;color:var(--md-on-surface-variant);text-decoration:none;
  transition:background 150ms,color 150ms;cursor:pointer;
}
.sidebar-link:hover{background:var(--md-surface-container-high);color:var(--md-on-surface)}
.sidebar-link.active{background:var(--md-primary-container);color:var(--md-on-primary-container);font-weight:500}
.sidebar-link .material-symbols-outlined{font-size:20px}

.sidebar-spacer{flex:1}
.sidebar-user{padding:12px;border-top:1px solid var(--md-outline-variant);margin-top:8px;display:flex;align-items:center;gap:10px}
.sidebar-avatar{width:36px;height:36px;border-radius:var(--r-full);background:var(--md-primary-container);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;color:var(--md-on-primary-container)}
.sidebar-user-info{flex:1}
.sidebar-user-name{font-size:13px;font-weight:500;color:var(--md-on-surface)}
.sidebar-user-role{font-size:11px;color:var(--md-outline);text-transform:capitalize}

/* ── MAIN CONTENT ── */
.main{margin-left:var(--sidebar-w);flex:1;min-height:100vh}

.topbar{
  height:var(--topbar-h);background:var(--glass-bg);backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);border-bottom:1px solid var(--glass-border);
  display:flex;align-items:center;justify-content:space-between;padding:0 32px;
  position:sticky;top:0;z-index:50;
}
.topbar-title{font-family:var(--font-display);font-size:20px;color:var(--md-on-surface)}
.topbar-actions{display:flex;align-items:center;gap:12px}
.topbar-btn{
  display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r-full);
  font-size:13px;font-weight:500;border:none;cursor:pointer;transition:all 150ms;
  font-family:var(--font-body);
}
.topbar-btn-primary{background:var(--md-primary);color:var(--md-on-primary);box-shadow:0 2px 6px rgba(61,61,239,0.25)}
.topbar-btn-primary:hover{background:var(--md-primary-dark);transform:translateY(-1px)}
.topbar-btn-outline{background:transparent;color:var(--md-on-surface-variant);border:1px solid var(--md-outline-variant)}
.topbar-btn-outline:hover{background:var(--md-surface-container-high)}

.content{padding:32px}

/* ── STAT CARDS ── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:32px}
.stat-card{
  background:var(--md-surface-bright);border-radius:var(--r-lg);padding:24px;
  border:1px solid var(--md-outline-variant);transition:box-shadow 200ms,transform 200ms;
}
.stat-card:hover{box-shadow:var(--elev-2);transform:translateY(-2px)}
.stat-card-label{font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--md-outline);margin-bottom:8px}
.stat-card-value{font-family:var(--font-display);font-size:36px;color:var(--md-on-surface);line-height:1}
.stat-card-delta{font-size:12px;margin-top:8px;display:flex;align-items:center;gap:4px}
.stat-card-delta.up{color:#1B5E20}
.stat-card-delta.down{color:#B71C1C}
.stat-card.accent{background:var(--md-primary);border-color:transparent}
.stat-card.accent .stat-card-label{color:rgba(255,255,255,0.7)}
.stat-card.accent .stat-card-value{color:#fff}
.stat-card.accent .stat-card-delta{color:rgba(255,255,255,0.8)}

/* ── DATA TABLE ── */
.card{background:var(--md-surface-bright);border-radius:var(--r-lg);border:1px solid var(--md-outline-variant);overflow:hidden;margin-bottom:24px}
.card-header{padding:20px 24px;border-bottom:1px solid var(--md-outline-variant);display:flex;align-items:center;justify-content:space-between}
.card-title{font-family:var(--font-display);font-size:18px;color:var(--md-on-surface)}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:12px 24px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--md-outline);background:var(--md-surface-container-low);border-bottom:1px solid var(--md-outline-variant)}
td{padding:14px 24px;font-size:14px;color:var(--md-on-surface);border-bottom:1px solid var(--md-surface-variant)}
tr:hover td{background:var(--md-surface-container-low)}
.badge{display:inline-flex;padding:4px 10px;border-radius:var(--r-full);font-size:11px;font-weight:500;letter-spacing:.04em}
.badge-success{background:#E8F5E9;color:#1B5E20}
.badge-warning{background:#FFF3E0;color:#E65100}
.badge-danger{background:#FDECEA;color:#B71C1C}
.badge-info{background:var(--md-primary-container);color:var(--md-on-primary-container)}

/* ── TOAST ── */
.toast{padding:12px 16px;border-radius:12px;font-size:13px;position:fixed;top:80px;right:24px;z-index:9999;animation:toastIn 300ms var(--ease-express)}
.toast-success{background:#E8F5E9;color:#1B5E20;border:1px solid rgba(27,94,32,0.15);box-shadow:var(--elev-3)}
.toast-error{background:#FDECEA;color:#B71C1C;border:1px solid rgba(183,28,28,0.15);box-shadow:var(--elev-3)}
@keyframes toastIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:1000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-card{background:var(--md-surface-bright);border-radius:var(--r-xl);padding:32px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,0.25)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.modal-header h3{font-family:var(--font-display);font-size:20px;color:var(--md-on-surface)}
.modal-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:24px;padding-top:16px;border-top:1px solid var(--md-outline-variant)}
.form-field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.form-field label{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--md-outline)}
.form-input{width:100%;padding:10px 14px;border:1.5px solid var(--md-outline-variant);border-radius:var(--r-md);font-family:var(--font-body);font-size:14px;color:var(--md-on-surface);background:var(--md-surface);transition:border-color 150ms;outline:none}
.form-input:focus{border-color:var(--md-primary)}
textarea.form-input{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@keyframes spin{to{transform:rotate(360deg)}}
/* ── RESPONSIVE ── */
@media(max-width:1200px){.stats-row{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .stats-row{grid-template-columns:1fr}
  .content{padding:20px 16px}
  .form-row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ══════ SIDEBAR ══════ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="sidebar-brand-icon">JCP</div>
    <div class="sidebar-brand-text">
      <div class="sidebar-brand-name">JCP Gestión</div>
      <div class="sidebar-brand-sub">Inmobiliaria · Admin</div>
    </div>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-section-title">General</div>
    <a href="/admin/dashboard" class="sidebar-link">
      <span class="material-symbols-outlined">dashboard</span> Dashboard
    </a>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-section-title">Inmobiliaria</div>
    <a href="/admin/propiedades" class="sidebar-link">
      <span class="material-symbols-outlined">home_work</span> Propiedades
    </a>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-section-title">Sistema</div>
    <a href="/admin/users" class="sidebar-link">
      <span class="material-symbols-outlined">group</span> Usuarios
    </a>
    <a href="/admin/funnel" class="sidebar-link">
      <span class="material-symbols-outlined">filter_alt</span> Funnel de ventas
    </a>
    <a href="/admin/settings" class="sidebar-link active">
      <span class="material-symbols-outlined">settings</span> Ajustes
    </a>
  </div>

  <div class="sidebar-spacer"></div>

  <div class="sidebar-user">
    <div class="sidebar-avatar">AD</div>
    <div class="sidebar-user-info">
      <div class="sidebar-user-name">Administrador</div>
      <form action="/admin/logout" method="POST" style="display:inline">
        <button type="submit" style="background:none;border:none;font-size:11px;color:var(--md-outline);cursor:pointer;padding:0">Cerrar sesión</button>
      </form>
    </div>
  </div>
</aside>

<!-- ══════ MAIN ══════ -->
<div class="main">
  <header class="topbar">
    <h1 class="topbar-title">Ajustes</h1>
  </header>

  <div class="content">
    <div class="card" style="max-width:560px">
      <div class="card-header">
        <h2 class="card-title">Configuración de la aplicación</h2>
      </div>
      <div style="padding:24px">
        <div id="toast-area"></div>
        <form hx-post="/admin/settings" hx-target="#toast-area" hx-swap="innerHTML">
          <div class="form-field">
            <label>URL del logo (admin sidebar)</label>
            <input type="url" name="logo_url" class="form-input"
                   id="settings-logo-url"
                   placeholder="https://ejemplo.com/logo.png"
                   hx-get="/admin/settings/current"
                   hx-trigger="load"
                   hx-target="this"
                   hx-swap="outerHTML"/>
            <span style="font-size:12px;color:var(--md-outline);margin-top:4px;display:block">
              Deja vacío para usar el logo por defecto (texto "JCP")
            </span>
          </div>
          <div class="modal-actions" style="justify-content:flex-start;padding-top:0;border-top:none;margin-top:0">
            <button type="submit" class="topbar-btn topbar-btn-primary">
              <span class="material-symbols-outlined" style="font-size:16px">save</span> Guardar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<div id="modal-container"></div>

<script>
// Sidebar active link
document.querySelectorAll('.sidebar-link').forEach(link => {
  link.addEventListener('click', function() {
    document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
    this.classList.add('active');
  });
});

// WebSocket connection for realtime updates (reconnect with backoff, no page reload)
(function() {
  let delay = 2000;
  function connect() {
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(protocol + '//' + location.host + '/ws/web');
    ws.onopen = function() { delay = 2000; };
    ws.onmessage = function(e) {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'refresh_all') {
          // no-op for settings page
        }
      } catch(_) {}
    };
    ws.onclose = function() {
      setTimeout(function() { connect(); delay = Math.min(delay * 2, 30000); }, delay);
    };
    ws.onerror = function() { ws.close(); };
  }
  connect();
})();
</script>
<script src="/static/js/admin-logo.js"></script>
</body>
</html>
